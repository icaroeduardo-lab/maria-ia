openapi: 3.0.3
info:
  title: Maria Chat API
  version: "1.0.0"
  description: >
    API do backend do Maria Chat (atendimento jurídico da DPERJ).
    Grupos: webhook do WhatsApp, chat público, autenticação, painel admin
    (prefixo /admin, JWT), rotas internas do fluxo (/api/*, chamadas pelo engine)
    e mocks de teste (/mock/*). Rotas do painel exigem Bearer JWT; mutações
    exigem papel admin.
servers:
  - url: http://maria-chat-prod-alb-554264540.us-east-1.elb.amazonaws.com
    description: Produção (AWS ALB)
  - url: http://localhost:3000
    description: Local

tags:
  - name: Webhook
  - name: Chat
  - name: Auth
  - name: Admin — Flows
  - name: Admin — Conversations
  - name: Admin — Assistidos
  - name: Admin — Config/Users/Analytics/Audit
  - name: Interno (fluxo)
  - name: Mock
  - name: Infra

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Erro:
      type: object
      properties:
        erro: { type: string }
    LoginReq:
      type: object
      required: [email, senha]
      properties:
        email: { type: string, format: email }
        senha: { type: string }
    LoginResp:
      type: object
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        nome: { type: string }
        role: { type: string, enum: [admin, viewer] }
    ChatReq:
      type: object
      required: [sessionId]
      properties:
        sessionId: { type: string }
        message: { type: string }
    ChatResp:
      type: object
      properties:
        messages:
          type: array
          items:
            type: object
            properties:
              role: { type: string }
              content: {}
        lgpdAceito: { type: boolean }
    FlowNode:
      type: object
      required: [id, type, position, data]
      properties:
        id: { type: string, description: "Estável — mudar reseta o cache de reescrita" }
        type:
          type: string
          enum: [mensagem, pergunta, condicao, classificar, ia, api, subgrafo, subfluxo, atribuir, encerrar]
        position:
          type: object
          required: [x, y]
          properties:
            x: { type: number }
            y: { type: number }
        data:
          type: object
          additionalProperties: true
          description: "Campos por tipo de nó — ver docs/guia-frontend.md §2.2"
    FlowEdge:
      type: object
      required: [id, source, target]
      properties:
        id: { type: string }
        source: { type: string }
        target: { type: string }
        label: { type: string, description: "Valor esperado em condicao/classificar; '*' = default" }
    Flow:
      type: object
      required: [id, name, nodes, edges, active]
      properties:
        id: { type: string }
        name: { type: string }
        nodes: { type: array, items: { $ref: '#/components/schemas/FlowNode' } }
        edges: { type: array, items: { $ref: '#/components/schemas/FlowEdge' } }
        active: { type: boolean }
        isTemplate: { type: boolean, description: "catálogo de templates — card #20260127" }
        dadosTeste:
          type: object
          additionalProperties: { type: string }
          nullable: true
          description: "seed sugerido de dadosColetados p/ testar subfluxo isolado (issue #134) — metadado, não versiona"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FlowVersionResumo:
      type: object
      required: [versao, name, criadoEm]
      properties:
        versao: { type: integer }
        name: { type: string }
        autor: { type: string, nullable: true, description: "email de quem salvou" }
        criadoEm: { type: string, format: date-time }
    FlowVersionCompleta:
      allOf:
        - $ref: '#/components/schemas/FlowVersionResumo'
        - type: object
          required: [id, flowId, nodes, edges]
          properties:
            id: { type: string }
            flowId: { type: string }
            nodes: { type: array, items: { $ref: '#/components/schemas/FlowNode' } }
            edges: { type: array, items: { $ref: '#/components/schemas/FlowEdge' } }
    ProcessosConsultaReq:
      type: object
      required: [cpf]
      properties:
        cpf: { type: string, description: "CPF só dígitos" }
    ProcessosConsultaResp:
      type: object
      properties:
        tem_processo: { type: boolean }
        processos:
          type: array
          items:
            type: object
            properties:
              numero: { type: string }
              assunto: { type: string }
              ativo: { type: boolean }
        lista: { type: string }
    ResumoReq:
      type: object
      properties:
        processo_sel: { type: string, description: "número completo ou índice (1,2,...)" }
        numero: { type: string }
        processos: { type: string, description: "JSON da consulta anterior (para mapear índice)" }
    ResumoResp:
      type: object
      properties:
        resumo: { type: string }
        numero: { type: string }
    ProcessoExisteReq:
      type: object
      properties:
        numero: { type: string }
    ProcessoExisteResp:
      type: object
      required: [existe]
      properties:
        existe: { type: boolean, description: "true se o número de processo foi encontrado no PDPJ" }
    CasosConsultaReq:
      type: object
      properties:
        cpf: { type: string }
        pagina_marcador:
          type: string
          description: "string acumulada pelo fluxo (1 char por página já vista) — comprimento decide a página (card #20260202, paginação de 10 em 10). Omitido/vazio = página 1."
    CasosConsultaResp:
      type: object
      properties:
        tem_casos: { type: boolean }
        temMais: { type: boolean, description: "true se existem mais casos além dos 10 já retornados em `lista`" }
        casos:
          type: array
          description: "campos preservam os nomes originais do Verde (issue maria-ia#110)"
          items:
            type: object
            properties:
              id: { type: integer }
              status: { type: string }
              tipoCaso: { type: string }
              assunto:
                type: object
                nullable: true
                properties:
                  id: { type: integer }
                  nome: { type: string }
              numeroProcesso: { type: string, nullable: true }
              dataAtualizacao: { type: string, nullable: true }
              orgaosAssociados:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    nome: { type: string }
                    responsavel: { type: boolean }
              andamentos:
                type: array
                items:
                  type: object
                  properties:
                    titulo: { type: string }
                    descricao: { type: string }
                    data: { type: string }
        lista: { type: string }
    PessoaPresaConsultaResp:
      type: object
      required: [encontrado, situacao, nome, tipoPreso, regime, idPessoa, idSeap]
      properties:
        encontrado: { type: boolean }
        situacao: { type: string, description: "ATIVO | LIBERTADO | FORAGIDO | EGRESSO | EVADIDO | ... (\"nao_encontrado\" se não achou)" }
        nome: { type: string }
        tipoPreso: { type: string, description: "CONDENADO | SENTENCIADO | PROVISORIO | ..." }
        regime: { type: string }
        idPessoa: { type: string, description: "usado em GET /api/pessoa-presa/casos?idPessoaPresa=" }
        idSeap: { type: string, description: "usado em GET /api/pessoa-presa/orgao-responsavel(-liberto)?idSeap=" }
    PessoaPresaProcessoResp:
      type: object
      required: [encontrado, numero, origem, idProcesso]
      properties:
        encontrado: { type: boolean }
        numero: { type: string }
        origem: { type: string, description: "ex: SEEU" }
        idProcesso: { type: string }
    PessoaPresaCasosResp:
      type: object
      required: [tem_casos, status, casos, lista]
      properties:
        tem_casos: { type: boolean }
        status: { type: string, description: "\"ABERTO\" (literal, comparado pelo nó condicao) ou \"\" se não há caso aberto" }
        casos:
          type: array
          items:
            type: object
            properties:
              identificador: { type: string }
              tipo: { type: string }
        lista: { type: string }
    PessoaPresaOrgaoResp:
      type: object
      required: [status, orgao]
      properties:
        status: { type: string, description: "\"encontrado\" (literal, comparado pelo nó condicao) ou \"nao_encontrado\"" }
        orgao:
          type: object
          nullable: true
          properties:
            nome: { type: string }
            telefone: { type: string }
            endereco: { type: string }
    PlantaoOrgaoResp:
      type: object
      required: [status, orgao]
      properties:
        status: { type: string, description: "\"encontrado\" (literal, comparado pelo nó condicao) ou \"nao_encontrado\"" }
        orgao:
          type: object
          nullable: true
          properties:
            nome: { type: string }
            telefone: { type: string, nullable: true }
            endereco: { type: string, nullable: true }
            municipio: { type: string }
            tipo: { type: string, description: "REGIONAL | CAPITAL — nunca MUNICIPAL (a rota já filtra)" }
    RecessoResp:
      type: object
      required: [status]
      properties:
        status: { type: string, description: "\"SEM_RECESSO_VIGENTE\" ou \"RECESSO_VIGENTE\" (literais, comparados pelo nó condicao)" }
        mensagem: { type: string, nullable: true, description: "mensagem pro assistido quando em recesso" }
    CpfReq:
      type: object
      required: [cpf]
      properties:
        cpf: { type: string }
    ElegibilidadeReq:
      type: object
      properties:
        telefone_whatsapp: { type: string, description: "wa_id cru (E.164 sem +), injetado automaticamente no invoke inicial — ver chat.ts" }
        cpf: { type: string }
    ElegibilidadeResp:
      type: object
      required: [decisao]
      properties:
        decisao: { type: string, description: "\"ok\" (segue normal) ou \"perguntar\" (fluxo pergunta residência/processo direto)" }
    TemCasoAbertoResp:
      type: object
      required: [tem_caso]
      properties:
        tem_caso: { type: boolean, description: "true se o CPF tem caso/processo aberto no Verde (prova RJ na prática)" }
    TemPendenciaAbertoResp:
      type: object
      required: [tem_pendencia]
      properties:
        tem_pendencia: { type: boolean, description: "true se o CPF tem caso OU agendamento em aberto no Verde (prova RJ na prática) — 1º passo da hierarquia do gate" }
    ResideRjFichaReq:
      type: object
      properties:
        uf: { type: string, description: "resultado_cpf.dados.uf (ficha do Verde)" }
        telefone: { type: string, description: "resultado_cpf.dados.telefone (ficha do Verde) — formato não garantido, DDD extraído de forma defensiva" }
    ResideRjFichaResp:
      type: object
      required: [reside_rj]
      properties:
        reside_rj: { type: boolean, description: "true se UF da ficha é RJ ou DDD do telefone da ficha é do RJ (21/22/24)" }
    CampoPreenchidoReq:
      type: object
      properties:
        valor: { type: string, description: "valor a checar (ex: UF da ficha, promovida pra chave flat antes)" }
    CampoPreenchidoResp:
      type: object
      required: [preenchido]
      properties:
        preenchido: { type: boolean, description: "true se valor não está vazio" }
    CasoDetalheReq:
      type: object
      properties:
        caso_sel: { type: string, description: "id completo ou índice (1,2,...)" }
        casos: { type: string, description: "JSON da consulta anterior (para mapear índice, resolve sem re-fetch)" }
    CasoDetalheResp:
      type: object
      required: [encontrado]
      properties:
        encontrado: { type: boolean }
        id: { type: integer }
        status: { type: string }
        tipoCaso: { type: string }
        assunto:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            nome: { type: string }
        orgaosAssociados:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              nome: { type: string }
              responsavel: { type: boolean }
        andamentos:
          type: array
          description: "só o mais recente (índice 0), não o histórico completo"
          items:
            type: object
            properties:
              titulo: { type: string }
              descricao: { type: string }
              data: { type: string }
        numeroProcesso: { type: string, nullable: true }
        processo:
          type: object
          nullable: true
          description: "junta GET /api/processo/{numero} quando há numeroProcesso — mesmo formato dessa rota, sem remapear"
        temProcesso: { type: string, description: "\"true\"/\"false\" — flag auxiliar pro fluxo rotear (condicao só faz match exato)" }
    AgendamentosConsultaResp:
      type: object
      properties:
        tem_agendamentos: { type: boolean }
        agendamentos:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              tipo: { type: string }
              data: { type: string, format: date-time }
              local: { type: string, nullable: true }
        lista: { type: string, description: "texto formatado, 1 linha por agendamento" }
    AgendamentoDetalheReq:
      type: object
      properties:
        agendamento_sel: { type: string, description: "id completo ou índice (1,2,...)" }
        agendamentos: { type: string, description: "JSON da consulta anterior (para mapear índice)" }
    AgendamentoDetalheResp:
      type: object
      required: [encontrado]
      properties:
        encontrado: { type: boolean }
        id: { type: string }
        tipo: { type: string }
        data: { type: string, format: date-time }
        local: { type: string, nullable: true }
        status: { type: string }
        assistido: { type: string }
    AgendamentoDetalheRicoReq:
      type: object
      required: [idEvento]
      properties:
        idEvento: { type: string }
    AgendamentoDetalheRicoResp:
      type: object
      required: [encontrado]
      description: "campos preservam os nomes originais do Verde (issue maria-ia#111, gateway#21)"
      properties:
        encontrado: { type: boolean }
        idEvento: { type: integer }
        idAssistido: { type: integer }
        idOrgao: { type: integer }
        idCaso: { type: integer, nullable: true }
        nomeAssistido: { type: string }
        nomeOrgao: { type: string }
        endereco: { type: string }
        data: { type: string }
        horario: { type: string }
        documentosNecessarios: { type: string, nullable: true }
        nomeAssunto: { type: string, nullable: true }
    AgendamentoVagasReq:
      type: object
      required: [idEvento]
      properties:
        idEvento: { type: string }
    AgendamentoVagasResp:
      type: object
      properties:
        tem_vagas: { type: boolean }
        vagas:
          type: array
          items:
            type: object
            properties:
              idIntervalo: { type: integer }
              data: { type: string }
              hora: { type: string }
        lista: { type: string, description: "texto formatado, 1 linha por vaga" }
    AgendamentoVagaDetalheReq:
      type: object
      properties:
        vaga_sel: { type: string, description: "índice (1,2,...) da lista de vagas anterior" }
        vagas: { type: string, description: "JSON da consulta de vagas anterior (resolve sem re-fetch)" }
    AgendamentoVagaDetalheResp:
      type: object
      required: [encontrada]
      properties:
        encontrada: { type: boolean }
        idIntervalo: { type: integer }
        data: { type: string }
        hora: { type: string }
    AgendamentoReagendarReq:
      type: object
      required: [idAgendamento, configuracaoIntervaloAgenda, dataNova]
      properties:
        idAgendamento: { type: string }
        configuracaoIntervaloAgenda: { type: string, description: "idIntervalo da vaga escolhida" }
        dataNova: { type: string }
        horaNova: { type: string, description: "combinada com dataNova antes de enviar ao Verde (\"DD/MM/YYYY HH:mm\")" }
    AgendamentoReagendarResp:
      type: object
      required: [sucesso]
      properties:
        sucesso: { type: boolean }
    AgendamentoDesmarcarReq:
      type: object
      required: [idAgendamento, idPessoa]
      properties:
        idAgendamento: { type: string }
        idPessoa: { type: string }
    AgendamentoDesmarcarResp:
      type: object
      required: [sucesso]
      properties:
        sucesso: { type: boolean }
        emailEnviado: { type: boolean, description: "204 do Verde (true) vs 200 sucesso parcial (false, e-mail falhou)" }
    VerificarDuplicadosReq:
      type: object
      required: [idPessoa, idAssunto]
      properties:
        idPessoa: { type: integer }
        idAssunto: { type: integer }
    VerificarDuplicadosResp:
      type: object
      required: [tem_duplicado]
      properties:
        tem_duplicado: { type: boolean }
        idAgendamentoDuplicado: { type: integer, nullable: true }
        dataDuplicado: { type: string, nullable: true }
    AgendarReq:
      type: object
      required: [idPessoa, idOrgao, idAssunto, idIntervalo, dataVaga]
      properties:
        idPessoa: { type: integer }
        idOrgao: { type: integer }
        idAssunto: { type: integer }
        idIntervalo: { type: integer, description: "vindo de orgao/primeiro-atendimento (primeira_vaga_intervalo) ou agendamentos/vagas" }
        dataVaga: { type: string, description: "\"DD/MM/YYYY HH:mm\"" }
        resumoAtendimento: { type: string }
        textoComplemento: { type: string }
    AgendarResp:
      type: object
      required: [sucesso]
      properties:
        sucesso: { type: boolean }
        idAgendamento: { type: integer, nullable: true }
    OrgaoPrimeiroAtendimentoReq:
      type: object
      required: [idPessoa, idAssunto]
      properties:
        idPessoa: { type: integer }
        idAssunto: { type: integer }
        complemento: { type: string }
    OrgaoHorario:
      type: object
      required: [idIntervalo, hora]
      properties:
        idIntervalo: { type: integer }
        hora: { type: string, description: "\"HH:mm\"" }
    OrgaoVagaAgrupada:
      type: object
      description: "Vagas agrupadas por data (fluxo mostra a data primeiro, depois os horários daquele dia — 2 telas, sem o fluxo precisar agrupar/computar nada)"
      required: [data, horarios]
      properties:
        data: { type: string, description: "\"DD/MM/YYYY\"" }
        horarios: { type: array, items: { $ref: '#/components/schemas/OrgaoHorario' } }
    OrgaoUnidade:
      type: object
      required: [id, nome, bairro, municipio, vagas]
      properties:
        id: { type: integer }
        nome: { type: string }
        bairro: { type: string, nullable: true }
        municipio: { type: string, nullable: true }
        vagas: { type: array, items: { $ref: '#/components/schemas/OrgaoVagaAgrupada' } }
    OrgaoPrimeiroAtendimentoResp:
      type: object
      description: >
        Regra de negócio (reescrita 2026-08): backend decide o máximo possível,
        fluxo só executa. Agrupa por (unidade, tipoAtendimento) descartando
        entradas sem vaga; só pergunta remoto-vs-presencial se os dois
        grupos tiverem opção; presencial pergunta unidade só se houver mais
        de 1; remoto nunca pergunta unidade (auto-escolhe a de mais
        horários no total). Vagas embutidas por unidade (zero 2ª chamada ao
        Verde) — resolver unidade escolhida via POST /api/orgao/unidade-detalhe.
      required: [perguntarTipo, tipoDefault, presencial, remoto, semVagaDisponivel]
      properties:
        perguntarTipo: { type: boolean, description: "true só quando presencial E remoto têm vaga" }
        tipoDefault: { type: string, nullable: true, description: "\"presencial\" | \"remoto\" | null — preenchido quando perguntarTipo=false e algum grupo tem vaga" }
        presencial:
          type: object
          required: [temOpcao, perguntarUnidade, unidades, vagasUnicaUnidade]
          properties:
            temOpcao: { type: boolean }
            perguntarUnidade: { type: boolean, description: "true quando há mais de 1 unidade presencial com vaga" }
            unidades: { type: array, items: { $ref: '#/components/schemas/OrgaoUnidade' }, description: "sempre embutida (com vagas) quando temOpcao=true, mesmo com 1 unidade só" }
            vagasUnicaUnidade: { type: array, items: { $ref: '#/components/schemas/OrgaoVagaAgrupada' }, description: "atalho == unidades[0].vagas, só não-vazio quando perguntarUnidade=false e temOpcao=true" }
        remoto:
          type: object
          required: [temOpcao, unidadeEscolhida, vagas]
          properties:
            temOpcao: { type: boolean }
            unidadeEscolhida:
              type: object
              nullable: true
              required: [id, nome]
              properties: { id: { type: integer }, nome: { type: string } }
            vagas: { type: array, items: { $ref: '#/components/schemas/OrgaoVagaAgrupada' } }
        semVagaDisponivel: { type: boolean, description: "true quando nenhum grupo (presencial ou remoto) tem vaga — fluxo trata como handoff" }
    OrgaoUnidadeDetalheReq:
      type: object
      required: [unidade_sel, orgao_resultado]
      properties:
        unidade_sel: { type: string, description: "índice 1-based na lista presencial.unidades, ou o id direto" }
        orgao_resultado: { type: string, description: "JSON cru devolvido por POST /api/orgao/primeiro-atendimento (mesma chave de dadosColetados, sem wrapper) — zero chamada nova ao Verde" }
    OrgaoUnidadeDetalheResp:
      type: object
      required: [encontrada]
      properties:
        encontrada: { type: boolean }
        id: { type: integer }
        nome: { type: string }
        bairro: { type: string, nullable: true }
        municipio: { type: string, nullable: true }
        vagas: { type: array, items: { $ref: '#/components/schemas/OrgaoVagaAgrupada' } }
    BloqueioVerificarReq:
      type: object
      required: [idPessoa, idAssunto, idOrgao]
      properties:
        idPessoa: { type: integer }
        idAssunto: { type: integer }
        idOrgao: { type: integer }
    BloqueioVerificarResp:
      type: object
      required: [tem_bloqueio]
      properties:
        tem_bloqueio: { type: boolean }
        data_bloqueio: { type: string, nullable: true }
        data_desbloqueio: { type: string, nullable: true }
    EncaminharReq:
      type: object
      required: [idPessoa, idOrgao, idAssunto, preferenciaAtendimento]
      properties:
        idPessoa: { type: integer }
        idOrgao: { type: integer }
        idAssunto: { type: integer }
        urgencia: { type: boolean }
        preferenciaAtendimento: { type: string, description: "\"Remoto\" | \"Presencial\"" }
        idLocalAtendimento: { type: integer, description: "obrigatório quando Presencial" }
        textoComplemento: { type: string }
    EncaminharResp:
      type: object
      required: [sucesso]
      properties:
        sucesso: { type: boolean }
        idEncaminhamento: { type: integer, nullable: true }
    ConsultarItemArvoreReq:
      type: object
      properties:
        idCategoria: { type: integer, description: "só na 1ª chamada" }
        idItemCategoria: { type: integer, description: "resposta escolhida no nível anterior" }
    ConsultarItemArvoreResp:
      type: object
      required: [assunto_encontrado]
      properties:
        assunto_encontrado: { type: boolean }
        idAssunto: { type: integer, nullable: true }
        pergunta: { type: string }
        respostas: { type: array, items: { type: object, properties: { id: { type: integer }, resposta: { type: string } } } }
        lista: { type: string, description: "respostas numeradas, pronta pra exibir" }
    ResolverEscolhaReq:
      type: object
      required: [escolha_sel, resultado_arvore]
      properties:
        escolha_sel: { type: string, description: "índice digitado (1, 2, ...) ou o texto da resposta" }
        resultado_arvore: { type: string, description: "JSON cru da resposta anterior de consultar-item-arvore (mesma chave de dadosColetados)" }
    ResolverEscolhaResp:
      type: object
      required: [encontrada]
      properties:
        encontrada: { type: boolean }
        idItemCategoria: { type: integer, nullable: true }
    AssuntoMetadadosResp:
      type: object
      required: [encontrado, urgente]
      properties:
        encontrado: { type: boolean }
        urgente: { type: boolean }
        documentos_necessarios:
          type: string
          nullable: true
          description: "txDocumentosNecessarios do Verde — texto pronto (markdown-like) pra exibir ao assistido. \"plantao\" do Verde é ignorado de propósito (fora de escopo, issue #132)."
    ConfigIA:
      type: object
      description: Configuração global da IA (singleton id=default)
      required: [estiloPrompt, conversacional]
      properties:
        estiloPrompt:
          type: string
          description: Preâmbulo de estilo aplicado a TODA fala da IA (vazio = usa o padrão)
        conversacional:
          type: boolean
          description: Liga/desliga a reescrita acolhedora das perguntas
        padrao:
          type: string
          description: Texto padrão do estilo (só no GET — alimenta o "restaurar padrão")
        horarioAtivo:
          type: boolean
          description: Liga/desliga o aviso automático de fora do expediente (issue #79)
        diasSemana:
          type: array
          description: Dias de expediente — 0=domingo...6=sábado
          items: { type: integer, minimum: 0, maximum: 6 }
        horaInicio:
          type: string
          description: Início do expediente, formato HH:mm (America/Sao_Paulo)
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        horaFim:
          type: string
          description: Fim do expediente (exclusive), formato HH:mm — precisa ser maior que horaInicio (sem overnight)
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        id: { type: string }
        updatedAt: { type: string, format: date-time }
    ConversaResumo:
      type: object
      description: Item da listagem — select enxuto, SEM PII (LGPD)
      required: [id, sessionId, channel, status, startedAt, updatedAt]
      properties:
        id: { type: string }
        sessionId: { type: string }
        channel: { type: string, description: "whatsapp | web" }
        flowId: { type: string, nullable: true }
        status: { type: string, description: "active | completed | abandoned" }
        categoria: { type: string, nullable: true }
        ultimaEtapa: { type: string, nullable: true }
        protocoloDperj: { type: string, nullable: true }
        tags: { type: array, items: { type: string }, description: "rótulos livres marcados pelo nó \"tag\" do fluxo (card #20260139)" }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    ConversasPage:
      type: object
      required: [total, page, itens]
      properties:
        total: { type: integer }
        page: { type: integer }
        itens: { type: array, items: { $ref: '#/components/schemas/ConversaResumo' } }
    ConversaDetalhe:
      allOf:
        - $ref: '#/components/schemas/ConversaResumo'
        - type: object
          properties:
            dadosColetados: { type: object, additionalProperties: true }
            resumo: { type: string, nullable: true }
            metadados:
              type: object
              nullable: true
              additionalProperties: true
              description: "assistido dentro de metadados vem MASCARADO (LGPD); completo só via /revelar"
    HandoffItem:
      type: object
      required: [id, sessionId, channel, handoffStatus]
      properties:
        id: { type: string }
        sessionId: { type: string }
        channel: { type: string }
        categoria: { type: string, nullable: true }
        handoffStatus: { type: string, enum: [aguardando, em_atendimento] }
        handoffOperador: { type: string, nullable: true }
        handoffDesde: { type: string, format: date-time, nullable: true }
    HandoffPage:
      type: object
      required: [itens]
      properties:
        itens: { type: array, items: { $ref: '#/components/schemas/HandoffItem' } }
    MensagemHistorico:
      type: object
      required: [role, content]
      properties:
        role: { type: string, description: "human | ai" }
        content:
          description: "string ou array de content blocks (text, image_url, boolean, options, cta_url)"
    HistoricoResp:
      type: object
      required: [messages]
      properties:
        messages: { type: array, items: { $ref: '#/components/schemas/MensagemHistorico' } }
    Assistido:
      type: object
      description: "Nas listagens os campos de PII vêm MASCARADOS; completos só no detalhe (auditado) e no /revelar"
      required: [id, cpf, nome, situacao]
      properties:
        id: { type: string }
        cpf: { type: string }
        nome: { type: string }
        dataNascimento: { type: string, nullable: true }
        nomeMae: { type: string, nullable: true }
        situacao: { type: string }
        municipio: { type: string, nullable: true }
        uf: { type: string, nullable: true }
        telefone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        cep: { type: string, nullable: true }
        bairro: { type: string, nullable: true }
        logradouro: { type: string, nullable: true }
        numero: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AssistidosPage:
      type: object
      required: [total, page, itens]
      properties:
        total: { type: integer }
        page: { type: integer }
        itens: { type: array, items: { $ref: '#/components/schemas/Assistido' } }
    AnalyticsSummary:
      type: object
      required: [total, taxaConclusao, porStatus, porCategoria, porCanal, abandonoPorEtapa, serieDiaria, mediaCsat, csatPorCategoria, csatPorFluxo]
      properties:
        total: { type: integer }
        taxaConclusao: { type: number, description: "0..1" }
        porStatus:
          type: array
          items: { type: object, required: [status, total], properties: { status: { type: string }, total: { type: integer } } }
        porCategoria:
          type: array
          items: { type: object, required: [categoria, total], properties: { categoria: { type: string }, total: { type: integer } } }
        porCanal:
          type: array
          items: { type: object, required: [canal, total], properties: { canal: { type: string }, total: { type: integer } } }
        abandonoPorEtapa:
          type: array
          items: { type: object, required: [etapa, total], properties: { etapa: { type: string }, total: { type: integer } } }
        serieDiaria:
          type: array
          description: "últimos 30 dias"
          items: { type: object, required: [dia, total, concluidas], properties: { dia: { type: string }, total: { type: integer }, concluidas: { type: integer } } }
        mediaCsat:
          type: number
          nullable: true
          description: "média geral da nota de satisfação (1-5); null se nenhuma conversa tem nota ainda"
        csatPorCategoria:
          type: array
          items: { type: object, required: [categoria, media], properties: { categoria: { type: string }, media: { type: number } } }
        csatPorFluxo:
          type: array
          items: { type: object, required: [flowId, media], properties: { flowId: { type: string }, media: { type: number } } }
    FunilPorNo:
      type: object
      required: [nodes]
      properties:
        nodes:
          type: array
          items: { type: object, required: [nodeId, total], properties: { nodeId: { type: string }, total: { type: integer } } }
    AuditLogItem:
      type: object
      required: [id, userId, userEmail, acao, alvoTipo, alvoId, criadoEm]
      properties:
        id: { type: string }
        userId: { type: string }
        userEmail: { type: string }
        acao: { type: string, description: "revelar" }
        alvoTipo: { type: string, description: "assistido | conversa" }
        alvoId: { type: string }
        criadoEm: { type: string, format: date-time }
    AuditPage:
      type: object
      required: [total, page, itens]
      properties:
        total: { type: integer }
        page: { type: integer }
        itens: { type: array, items: { $ref: '#/components/schemas/AuditLogItem' } }

security:
  - bearerAuth: []

paths:
  # ── Webhook ────────────────────────────────────────────────
  /webhook/whatsapp:
    get:
      tags: [Webhook]
      summary: Verificação do webhook (challenge da Meta)
      security: []
      parameters:
        - { in: query, name: "hub.mode", schema: { type: string } }
        - { in: query, name: "hub.verify_token", schema: { type: string } }
        - { in: query, name: "hub.challenge", schema: { type: string } }
      responses:
        "200": { description: Retorna o challenge }
        "403": { description: Token inválido }
    post:
      tags: [Webhook]
      summary: Recebe mensagens do WhatsApp (responde 200 imediato, processa async)
      security: []
      responses:
        "200": { description: Aceito }

  # ── Chat público ───────────────────────────────────────────
  /api/chat:
    post:
      tags: [Chat]
      summary: Envia mensagem (canal web)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatReq' }
      responses:
        "200":
          description: Respostas da Maria
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResp' }

  # ── Auth ───────────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Login (JWT 8h)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginReq' }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResp' }
        "401": { description: Credenciais inválidas }
  /auth/me:
    get:
      tags: [Auth]
      summary: Dados do usuário autenticado
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  # ── Admin: Upload ──────────────────────────────────────────
  /admin/upload:
    post:
      tags: [Admin — Flows]
      summary: Upload de imagem p/ os fluxos (admin) — re-encoda (remove EXIF) e grava no S3
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary, description: "jpeg/png/webp, máx 5MB" }
      responses:
        "200": { description: "{ url } — URL pública permanente (S3)" }
        "413": { description: Arquivo grande demais }
        "415": { description: Formato não suportado }

  # ── Admin: Flows ───────────────────────────────────────────
  /admin/flows:
    get:
      tags: [Admin — Flows]
      summary: Lista fluxos
      responses:
        "200":
          description: Lista (sem nodes/edges — resumo)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, active]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    active: { type: boolean }
                    isTemplate: { type: boolean }
                    createdAt: { type: string, format: date-time }
                    updatedAt: { type: string, format: date-time }
    post:
      tags: [Admin — Flows]
      summary: Cria fluxo (admin)
      responses:
        "200":
          description: Criado
          content: { application/json: { schema: { $ref: '#/components/schemas/Flow' } } }
        "400":
          description: name obrigatório
          content: { application/json: { schema: { $ref: '#/components/schemas/Erro' } } }
  /admin/flows/{id}:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    get:
      tags: [Admin — Flows]
      summary: Detalha fluxo
      responses: { "200": { content: { application/json: { schema: { $ref: '#/components/schemas/Flow' } } } }, "404": { description: Não encontrado } }
    put:
      tags: [Admin — Flows]
      summary: Atualiza fluxo (admin) — lock otimista opcional
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                nodes: { type: array, items: { $ref: '#/components/schemas/FlowNode' } }
                edges: { type: array, items: { $ref: '#/components/schemas/FlowEdge' } }
                updatedAt:
                  type: string
                  format: date-time
                  description: >
                    Lock otimista (opcional): updatedAt carregado pelo cliente.
                    Se o fluxo mudou desde então, a API responde 409 — recarregue
                    antes de salvar. Omitido = save incondicional.
      responses:
        "200":
          description: Fluxo atualizado
          content: { application/json: { schema: { $ref: '#/components/schemas/Flow' } } }
        "404": { description: Não encontrado }
        "409":
          description: "Conflito: fluxo alterado por outro editor"
          content:
            application/json:
              schema:
                type: object
                required: [erro, updatedAt]
                properties:
                  erro: { type: string }
                  updatedAt: { type: string, format: date-time }
    delete:
      tags: [Admin — Flows]
      summary: Remove fluxo (admin)
      responses:
        "200": { description: OK }
        "404": { description: Não encontrado, content: { application/json: { schema: { $ref: '#/components/schemas/Erro' } } } }
  /admin/flows/{id}/versoes:
    get:
      tags: [Admin — Flows]
      summary: Histórico de versões do fluxo (snapshot a cada save)
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Versões, mais recente primeiro
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FlowVersionResumo' }
        "404": { description: Não encontrado }
  /admin/flows/{id}/versoes/{versao}:
    get:
      tags: [Admin — Flows]
      summary: Detalhe de uma versão (com nodes/edges, p/ preview)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: versao, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Versão completa
          content: { application/json: { schema: { $ref: '#/components/schemas/FlowVersionCompleta' } } }
        "404": { description: Não encontrada }
  /admin/flows/{id}/versoes/{versao}/restaurar:
    post:
      tags: [Admin — Flows]
      summary: Restaura uma versão (admin) — estado atual vira nova versão antes (reversível)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: versao, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Fluxo restaurado
          content: { application/json: { schema: { $ref: '#/components/schemas/Flow' } } }
        "404": { description: Não encontrada }
  /admin/flows/{id}/validar:
    get:
      tags: [Admin — Flows]
      summary: Valida fluxo (estrutura + compilação)
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ ok, erros[] }" }
        "404": { description: Não encontrado, content: { application/json: { schema: { $ref: '#/components/schemas/Erro' } } } }
  /admin/flows/{id}/activate:
    post:
      tags: [Admin — Flows]
      summary: Ativa fluxo (desativa os demais) (admin)
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "404": { description: Não encontrado, content: { application/json: { schema: { $ref: '#/components/schemas/Erro' } } } }
  /admin/flows/{id}/deactivate:
    post:
      tags: [Admin — Flows]
      summary: Desativa fluxo (admin)
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "404": { description: Não encontrado, content: { application/json: { schema: { $ref: '#/components/schemas/Erro' } } } }
  /admin/flows/{id}/marcar-template:
    post:
      tags: [Admin — Flows]
      summary: Marca fluxo como template do catálogo (admin) — metadado, não versiona
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Flow' } } } }
        "404": { description: Não encontrado }
  /admin/flows/{id}/desmarcar-template:
    post:
      tags: [Admin — Flows]
      summary: Desmarca fluxo como template do catálogo (admin)
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Flow' } } } }
        "404": { description: Não encontrado }
  /admin/flows/{id}/dados-teste:
    put:
      tags: [Admin — Flows]
      summary: Define o seed de dadosColetados usado pelo chat de teste (issue #134) — metadado, não versiona
      description: >
        Sem lock otimista por updatedAt e sem criar FlowVersion (mesmo
        raciocínio de marcar-template/desmarcar-template) — é um rascunho de
        teste, não conteúdo do fluxo. Usado por /admin/test-chat via
        dadosIniciais na 1ª chamada da sessão.
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dadosTeste:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Flow' } } } }
        "404": { description: Não encontrado, content: { application/json: { schema: { $ref: '#/components/schemas/Erro' } } } }

  # ── Admin: Conversations ───────────────────────────────────
  /admin/conversations:
    get:
      tags: [Admin — Conversations]
      summary: Lista conversas (filtros status/categoria/channel, paginado; itens SEM PII)
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: categoria, schema: { type: string } }
        - { in: query, name: channel, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer } }
      responses:
        "200":
          description: Página de conversas (select enxuto, sem PII)
          content: { application/json: { schema: { $ref: '#/components/schemas/ConversasPage' } } }
  /admin/conversations/{sessionId}:
    get:
      tags: [Admin — Conversations]
      summary: Detalha conversa (assistido mascarado nos metadados)
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Conversa completa com PII mascarada
          content: { application/json: { schema: { $ref: '#/components/schemas/ConversaDetalhe' } } }
        "404": { description: Não encontrada }
  /admin/conversations/{sessionId}/historico:
    get:
      tags: [Admin — Conversations]
      summary: Histórico do chat (lê o checkpoint)
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Mensagens da conversa (content blocks)
          content: { application/json: { schema: { $ref: '#/components/schemas/HistoricoResp' } } }
  /admin/conversations/{sessionId}/revelar:
    post:
      tags: [Admin — Conversations]
      summary: Revela PII do assistido (admin, auditado)
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }]
      responses:
        "404":
          description: Conversa não encontrada
          content: { application/json: { schema: { $ref: '#/components/schemas/Erro' } } }
        "200":
          description: Dados completos do assistido (acesso registrado em auditoria)
          content:
            application/json:
              schema:
                type: object
                required: [assistido]
                properties:
                  assistido:
                    allOf: [{ $ref: '#/components/schemas/Assistido' }]
                    nullable: true

  # ── Admin: Handoff (atendente humano) ──────────────────────
  /admin/handoff:
    get:
      tags: [Admin — Handoff]
      summary: Lista conversas em handoff (aguardando ou em atendimento)
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [aguardando, em_atendimento] } }
      responses:
        "200":
          description: Fila de handoff
          content: { application/json: { schema: { $ref: '#/components/schemas/HandoffPage' } } }
  /admin/handoff/{sessionId}/assumir:
    post:
      tags: [Admin — Handoff]
      summary: Operador assume a conversa (bot já está pausado)
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "404": { description: Não encontrada }
        "409": { description: "Conversa não está aguardando atendente" }
  /admin/handoff/{sessionId}/liberar:
    post:
      tags: [Admin — Handoff]
      summary: Libera a conversa de volta pro bot (retoma o grafo no próximo nó)
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "404": { description: Não encontrada }
        "409": { description: "Conversa não está em handoff" }
  /admin/handoff/{sessionId}/responder:
    post:
      tags: [Admin — Handoff]
      summary: Operador responde diretamente (fora do fluxo automático)
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        "200": { description: OK }
        "400": { description: "message obrigatório" }
        "404": { description: Não encontrada }
        "409": { description: "Conversa não está em atendimento" }

  # ── Admin: Assistidos ──────────────────────────────────────
  /admin/assistidos:
    get:
      tags: [Admin — Assistidos]
      summary: Lista assistidos (mascarados; busca por cpf/nome)
      parameters:
        - { in: query, name: busca, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer } }
      responses:
        "200":
          description: Página de assistidos com PII mascarada
          content: { application/json: { schema: { $ref: '#/components/schemas/AssistidosPage' } } }
    post:
      tags: [Admin — Assistidos]
      summary: Cria assistido (admin)
      responses:
        "200":
          description: Assistido criado
          content: { application/json: { schema: { $ref: '#/components/schemas/Assistido' } } }
        "400":
          description: cpf inválido (11 dígitos) ou nome obrigatório
          content: { application/json: { schema: { $ref: '#/components/schemas/Erro' } } }
        "409":
          description: CPF já cadastrado
          content: { application/json: { schema: { $ref: '#/components/schemas/Erro' } } }
  /admin/assistidos/{id}:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    get:
      tags: [Admin — Assistidos]
      summary: Detalha assistido (admin, dados completos + auditoria)
      responses:
        "200":
          description: Dados completos (acesso auditado)
          content: { application/json: { schema: { $ref: '#/components/schemas/Assistido' } } }
