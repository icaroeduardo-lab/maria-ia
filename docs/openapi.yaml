  /api/upload-documento:
    post:
      tags: [Interno (fluxo)]
      summary: Upload de documento/comprovante pelo assistido (bucket privado) — avança a conversa
      description: >
        Sem JWT: autenticação é por posse do sessionId (thread_id da conversa).
        Magic bytes decidem o mimetype real (Content-Type declarado nunca é
        confiável) — jpeg/png/PDF até 10MB. Nunca retorna URL/key do S3 (LGPD).
      security: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [sessionId, file]
              properties:
                sessionId: { type: string, description: "sessionId/thread_id da conversa (web ou wa:<numero>)" }
                file: { type: string, format: binary, description: "jpeg/png/PDF, máx 10MB" }
      responses:
        "200": { description: "{ nome, tamanho, mimeType, messages } — conversa avançada" }
        "400": { description: "sessionId ou file ausente" }
        "404": { description: "sessionId inexistente ou conversa não ativa" }
        "413": { description: Arquivo grande demais }
        "415": { description: "Tipo de arquivo não aceito (magic bytes)" }
        "429": { description: Rate limit de uploads excedido }
        "503": { description: banco não configurado }
  /api/documentos/verificar:
    post:
      tags: [Interno (fluxo)]
      summary: Verifica documento de identidade por OCR (compara nome/CPF extraídos com o cadastro)
      description: >
        Busca o documento mais recente enviado nessa sessão (bucket privado —
        ver /api/upload-documento), roda OCR via Bedrock multimodal e compara
        nome/CPF extraídos com o que o assistido já digitou no cadastro
        (dadosColetados.nome/cpf da mesma sessão). Sem JWT: autenticação é por
        posse do sessionId. Nunca retorna nome/CPF extraído bruto (LGPD) — só
        os booleans de match.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: string, description: "sessionId/thread_id da conversa (aceita também _sessao, mandado automaticamente pelo nó api)" }
                nome: { type: string, description: "nome já digitado no cadastro — mandado pelo nó api via camposCorpo; sem isso, cai pro snapshot em Postgres" }
                cpf: { type: string, description: "cpf já digitado no cadastro — mesmo racional do nome" }
      responses:
        "200": { description: "{ match, detalhes: { nome_ok, cpf_ok } }" }
        "400": { description: "sessionId ausente" }
        "404": { description: "nenhum documento encontrado para essa sessão no bucket" }
        "422": { description: "nome/cpf ainda não coletados nesta sessão" }
        "500": { description: "falha ao processar o documento (OCR/Bedrock)", content: { application/json: { schema: { $ref: '#/components/schemas/Erro' } } } }

